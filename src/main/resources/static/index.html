<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Warsztat 4x4 – Rezerwacja</title>
    <link href="styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
</head>
<body>
<h1>Rezerwacja wizyty w warsztacie</h1>

<nav class="navbar">
    <ul>
        <li><a href="index.html">Panel klienta</a></li>
        <li><a href="admin.html">Panel admina</a></li>
    </ul>
</nav>

<div class="flexbox">
    <!-- Formularz klienta -->
    <form id="rezerwacjaForm">
        <label for="firstName">Imię:</label>
        <input type="text" id="firstName" required>
        <label for="lastName">Nazwisko:</label>
        <input type="text" id="lastName" required>
        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <label for="phoneNumber">Telefon:</label>
        <input type="text" id="phoneNumber" required>
        <label for="carBrand">Marka pojazdu:</label>
        <input type="text" id="carBrand">
        <label for="carModel">Model pojazdu:</label>
        <input type="text" id="carModel">
        <label for="serviceType">Typ usługi:</label>
        <select id="serviceType" required>
            <option value="">-- Wybierz --</option>
        </select>
        <label for="visitDate">Data podstawienia pojazdu (pon-pt):</label>
        <input type="date" id="visitDate" required>
        <div class="msg error" id="visitDateError" hidden>Warsztat nie pracuje w wybranym dniu (sobota/niedziela) — wybierz dzień od poniedziałku do piątku.</div>
        <label for="visitTime">Godzina podstawienia (08:00-16:00):</label>
        <input type="time" id="visitTime" min="08:00" max="15:59" required>
        <div class="msg error" id="visitTimeError" hidden>Godzina poza godzinami pracy warsztatu (08:00-16:00).</div>
        <label for="notes">Notatka (opcjonalnie):</label>
        <textarea id="notes" name="notes" rows="5" style="resize:vertical;"></textarea>
        <div class="msg" id="msg"></div>
        <button type="submit">Wyślij rezerwację</button>
    </form>

    <!-- Kalendarz po prawej stronie -->
    <div id="calendar-container">
        <div id="calendar"></div>
    </div>
</div>

<script>
    // Wczytanie typów usług z backendu (czas trwania decyduje, kiedy auto będzie gotowe do odbioru)
    async function loadServiceTypes() {
        const res = await fetch('/service-types');
        if (!res.ok) return;
        const types = await res.json();
        const select = document.getElementById('serviceType');
        types.forEach(t => {
            const option = document.createElement('option');
            option.value = t.id;
            option.textContent = t.name + (t.durationMinutes ? ` (${formatDuration(t.durationMinutes)})` : '');
            select.appendChild(option);
        });
    }

    function formatDuration(minutes) {
        if (minutes < 60) return minutes + ' min';
        const hours = minutes / 60;
        if (hours < 8) return hours + ' h';
        const days = Math.round(hours / 8);
        return days + (days === 1 ? ' dzień roboczy' : ' dni robocze');
    }

    loadServiceTypes();

    // Walidacja godzin pracy warsztatu (pon-pt 08:00-16:00) po stronie frontendu —
    // żeby błąd był widoczny natychmiast, zanim formularz trafi do backendu.
    function isWeekendDate(dateStr) {
        if (!dateStr) return false;
        const day = new Date(dateStr + 'T00:00:00').getDay(); // 0 = niedziela, 6 = sobota
        return day === 0 || day === 6;
    }

    function isOutsideWorkingHours(timeStr) {
        if (!timeStr) return false;
        return timeStr < '08:00' || timeStr >= '16:00';
    }

    function validateVisitDate() {
        const invalid = isWeekendDate(visitDate.value);
        document.getElementById('visitDateError').hidden = !invalid;
        return !invalid;
    }

    function validateVisitTime() {
        const invalid = isOutsideWorkingHours(visitTime.value);
        document.getElementById('visitTimeError').hidden = !invalid;
        return !invalid;
    }

    visitDate.addEventListener('change', validateVisitDate);
    visitTime.addEventListener('change', validateVisitTime);

    // Obsługa wysyłki formularza (AJAX, bez przeładowania strony)
    document.getElementById('rezerwacjaForm').onsubmit = async function (e) {
        e.preventDefault();

        const dateOk = validateVisitDate();
        const timeOk = validateVisitTime();
        if (!dateOk || !timeOk) {
            document.getElementById('msg').textContent = 'Popraw zaznaczone pola przed wysłaniem.';
            document.getElementById('msg').classList.add('error');
            return;
        }

        const res = await fetch('/api/reservations', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                firstName: firstName.value,
                lastName: lastName.value,
                email: email.value,
                phoneNumber: phoneNumber.value,
                carBrand: carBrand.value,
                carModel: carModel.value,
                serviceType: {id: Number(serviceType.value)},
                visitDate: visitDate.value,
                visitTime: visitTime.value,
                clientNotes: notes.value
            })
        });
        if (res.ok) {
            const created = await res.json();
            document.getElementById('msg').textContent =
                `Rezerwacja wysłana! Przewidywany odbiór: ${created.endDate} ${created.endTime} (stanowisko ${created.stationNumber}).`;
            document.getElementById('msg').classList.remove('error');
            rezerwacjaForm.reset();
            document.getElementById('visitDateError').hidden = true;
            document.getElementById('visitTimeError').hidden = true;
        } else {
            const error = await res.text();
            document.getElementById('msg').textContent = "Błąd: " + error;
            document.getElementById('msg').classList.add('error');
        }
    };

    // Obsługa FullCalendar
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            slotMinTime: "08:00:00",
            slotMaxTime: "16:00:00",
            allDaySlot: false,
            locale: 'pl',
            selectable: true,
            firstDay: 1, // Poniedziałek jako pierwszy dzień tygodnia
            weekends: false, // Warsztat pracuje tylko pon-pt
            select: function(info) {
                document.getElementById('visitDate').value = info.startStr.slice(0,10);
                document.getElementById('visitTime').value = info.startStr.slice(11,16);
                validateVisitDate();
                validateVisitTime();
            },
            events: '/api/reservations/calendar/fullcalendar',
            height: 'auto',
            contentHeight: 'auto'
        });
        calendar.render();

        // Wyrównanie wysokości kalendarza do formularza (responsywność)
        function resizeCalendarHeight() {
            var formHeight = document.getElementById('rezerwacjaForm').offsetHeight;
            document.getElementById('calendar-container').style.height = formHeight + 'px';
        }
        resizeCalendarHeight();
        window.addEventListener('resize', resizeCalendarHeight);
    });
</script>
</body>
</html>
