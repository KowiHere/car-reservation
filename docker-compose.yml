services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: warsztat
      POSTGRES_USER: warsztat
      POSTGRES_PASSWORD: warsztat_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warsztat -d warsztat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
